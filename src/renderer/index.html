<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws:"
    />
    <title>桌宠</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <span class="indicator" aria-hidden="true"></span>
        <h1>桌宠</h1>
      </header>
      <p class="hint">卡片以外的区域应当完全透明，可以直接看到桌面内容。</p>
      <div class="actions">
        <button id="toggle-top" type="button">关闭置顶</button>
        <button id="quit" type="button" class="ghost">退出</button>
      </div>
      <p class="meta" id="runtime"></p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
